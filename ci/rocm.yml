include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

stages:
  - build
  - test

build rocm:
  stage: build
  extends: .container-builder-cscs-zen2
  before_script:
    - TAG_DOCKERFILE=`sha256sum $DOCKERFILE | head -c 8`
    - TAG=${TAG_DOCKERFILE}
    - export PERSIST_IMAGE_NAME=$CSCS_REGISTRY_PATH/base/mtt-base-rocm:$TAG
    - echo "BASE_IMAGE_ROCM=$PERSIST_IMAGE_NAME" > build.env
    - 'echo "INFO: Building image $PERSIST_IMAGE_NAME"'
  artifacts:
    reports:
      dotenv: build.env
  variables:
    DOCKERFILE: ci/containers/Containerfile.rocm

test cpp rocm:
  stage: test
  extends: .container-runner-beverin-mi300
  image: $BASE_IMAGE_ROCM
  timeout: 1h
  script:
    - mkdir buildcpp
    - cmake -B buildcpp -S . -DSPHERICART_BUILD_TESTS=ON -DSPHERICART_OPENMP=ON -DSPHERICART_BUILD_EXAMPLES=ON -DSPHERICART_ENABLE_HIP=ON -DSPHERICART_BUILD_TORCH=ON
    - cmake --build buildcpp --parallel
    - ctest --test-dir buildcpp --output-on-failure
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_PARTITION: mi300
    SLURM_NTASKS: 1
    SLURM_TIMELIMIT: '00:10:00'
    GIT_STRATEGY: fetch
