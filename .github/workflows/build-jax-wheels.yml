name: Build JAX Wheels

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    # Check all PR

concurrency:
  group: jax-wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-jax-sdist:
    runs-on: ubuntu-24.04
    name: sdist
    env:
      SPHERICART_NO_LOCAL_DEPS: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"

    - name: Install dependencies
      run: python -m pip install build

    - name: Build jax sdist
      run: python -m build --sdist ./sphericart-jax --outdir ./dist

    - uses: actions/upload-artifact@v7
      with:
        name: "sphericart-jax-sdist"
        path: ./dist/*.tar.gz

    - name: upload to GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ./dist/*.tar.gz
        prerelease: ${{ contains(github.ref, '-rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-jax-wheels:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: x86_64 Linux
            os: ubuntu-24.04
            arch: x86_64
          - name: aarch64 Linux
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: arm64 macOS
            os: macos-15
            arch: arm64
          - name: x86_64 Windows
            os: windows-2022
            arch: AMD64

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"

    - name: Install dependencies
      run: python -m pip install cibuildwheel twine

    - name: Build jax wheels
      run: python -m cibuildwheel ./sphericart-jax
      env:
        # the wheel does not depend on the Python version, any version
        # supported by the oldest jaxlib works to build it
        CIBW_BUILD: "cp312-*"
        CIBW_SKIP: "*-musllinux*"
        CIBW_ARCHS: "${{ matrix.arch }}"
        CIBW_BUILD_VERBOSITY: 1
        # jaxlib wheels require glibc >= 2.27.
        CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
        CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux_2_28_aarch64
        CIBW_REPAIR_WHEEL_COMMAND_MACOS: |
          delocate-wheel --ignore-missing-dependencies \
                         --require-archs {delocate_archs} \
                         -w {dest_dir} -v {wheel}
        CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
        CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair -w {dest_dir} {wheel}
        CIBW_ENVIRONMENT: >
          SPHERICART_ARCH_NATIVE=OFF
          SPHERICART_NO_LOCAL_DEPS=1
          MACOSX_DEPLOYMENT_TARGET=11

    - name: check wheels with twine
      run: twine check wheelhouse/*

    - uses: actions/upload-artifact@v7
      with:
        name: sphericart-jax-wheel-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse/*.whl

    - name: upload to GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ./wheelhouse/*.whl
        prerelease: ${{ contains(github.ref, '-rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
